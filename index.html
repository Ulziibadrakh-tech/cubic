<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CUBIC Best-shot Workspace</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='7' fill='%230071E3'/%3E%3Crect x='10' y='10' width='12' height='12' rx='3' fill='%23FFB800'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fonts" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" media="print">
<style>
/* Apple-like calm with the warmth of an animated film: one column, phone first, grouped
   panels, rounded friendly type, candy colours with soft light on the cube, and motion that
   squashes, overshoots and settles. The cube is the map; a space is a plain list. */
:root {
  --bg: #F5F5F7; --sunk: #FFFFFF;
  --ink: #1D1D1F; --ink-2: #6E6E73;
  --line: #1D1D1F; --hair: #E3E3E8;
  --accent: #0066CC; --accent-fill: #0071E3; --on-accent: #FFFFFF; --warm: #FFB800; --good: #188038; --on-good: #FFFFFF; --bad: #C5221F; --away: #B25E00;
  --bad-fill: #D93025; --on-bad: #FFFFFF;
  --f0: #FF6B5B; --fi0: #1D1D1F;  --f1: #4DA3FF; --fi1: #0B1B33;  --f2: #FFC93C; --fi2: #1D1D1F;
  --f3: #3CCB97; --fi3: #0B2A1F;  --f4: #A78BFA; --fi4: #1D1D1F;  --f5: #FF8FB1; --fi5: #1D1D1F;
  --p-vida: #0071E3; --p-anand: #D93025; --p-obama: #7B4AE2; --p-ink: #FFFFFF;
  --display: 'Nunito', ui-rounded, 'SF Pro Rounded', 'Helvetica Neue', Arial, sans-serif;
  --body: 'Inter', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --rule: 1.5px; --r: 22px; --r-sm: 14px;
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --glow: color-mix(in srgb, #0071E3 9%, #F5F5F7);
  /* The plan graph: a printed chart's neutrals; its status text passes 4.5:1 on paper, bands and cards. */
  --g-paper: #FFFFFF; --g-band: #F4F5F7; --g-node: #FFFFFF; --g-node-done: #F6F7F9; --g-wash: #EAF2FC;
  --g-rule: #E3E5E9; --g-rule-2: #C8CCD3; --g-edge: #858B96; --g-edge-quiet: #B9BEC6; --g-bar: #3D434D;
  --g-ink-2: #5B616B; --g-acc: #0062C4; --g-bad: #C5221F;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 32px rgba(29,29,31,.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1117; --sunk: #161B22; --ink: #E6EDF3; --ink-2: #9198A1; --line: #E6EDF3; --hair: #30363D;
    --accent: #4493F8; --accent-fill: #1F6FEB; --on-accent: #FFFFFF; --warm: #E3B341; --good: #3FB950; --on-good: #0D1117; --bad: #F85149; --away: #D29922;
    --bad-fill: #DA3633; --on-bad: #FFFFFF;
    --f0: #F47067; --fi0: #1C2128;  --f1: #539BF5; --fi1: #0D1117;  --f2: #DAAA3F; --fi2: #1C2128;
    --f3: #57AB5A; --fi3: #0D1117;  --f4: #B083F0; --fi4: #0D1117;  --f5: #E275AD; --fi5: #0D1117;
    --p-vida: #1F6FEB; --p-anand: #DA3633; --p-obama: #8957E5;
    --glow: color-mix(in srgb, #1F6FEB 16%, #0D1117);
    --shadow: 0 0 0 1px #30363D, 0 8px 24px rgba(1,4,9,.55);
    --g-paper: #0D1117; --g-band: #131922; --g-node: #161B22; --g-node-done: #11161D; --g-wash: #152338;
    --g-rule: #262C35; --g-rule-2: #3A424D; --g-edge: #6B7480; --g-edge-quiet: #4A525D; --g-bar: #C3CBD4;
    --g-ink-2: #9BA4AE; --g-acc: #58A0FA; --g-bad: #F85149;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1117; --sunk: #161B22; --ink: #E6EDF3; --ink-2: #9198A1; --line: #E6EDF3; --hair: #30363D;
  --accent: #4493F8; --accent-fill: #1F6FEB; --on-accent: #FFFFFF; --warm: #E3B341; --good: #3FB950; --on-good: #0D1117; --bad: #F85149; --away: #D29922;
    --bad-fill: #DA3633; --on-bad: #FFFFFF;
  --f0: #F47067; --fi0: #1C2128;  --f1: #539BF5; --fi1: #0D1117;  --f2: #DAAA3F; --fi2: #1C2128;
  --f3: #57AB5A; --fi3: #0D1117;  --f4: #B083F0; --fi4: #0D1117;  --f5: #E275AD; --fi5: #0D1117;
  --p-vida: #1F6FEB; --p-anand: #DA3633; --p-obama: #8957E5;
  --glow: color-mix(in srgb, #1F6FEB 16%, #0D1117);
  --shadow: 0 0 0 1px #30363D, 0 8px 24px rgba(1,4,9,.55);
  --g-paper: #0D1117; --g-band: #131922; --g-node: #161B22; --g-node-done: #11161D; --g-wash: #152338;
  --g-rule: #262C35; --g-rule-2: #3A424D; --g-edge: #6B7480; --g-edge-quiet: #4A525D; --g-bar: #C3CBD4;
  --g-ink-2: #9BA4AE; --g-acc: #58A0FA; --g-bad: #F85149;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 16px; line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.wrap { max-width: 760px; margin: 0 auto; padding: 18px 16px 56px; display: flex; flex-direction: column; gap: 22px; }

/* Masthead */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.mark { margin: 0; font-family: var(--display); font-weight: 900; font-size: clamp(52px, 15vw, 96px); line-height: .82; letter-spacing: -.055em; }
.mark::after { content: ''; display: inline-block; width: .16em; height: .16em; background: var(--accent); margin-left: .05em; }
.tool { min-width: 40px; height: 34px; padding: 0 10px; border: 1px solid var(--hair); border-radius: 999px; background: var(--sunk); color: var(--ink); font: 700 13px/1 var(--body); letter-spacing: .04em; }
.tool:hover { border-color: var(--accent); color: var(--accent); }
.sync { grid-column: 1 / -1; font-size: 13px; color: var(--ink-2); min-height: 19px; font-weight: 500; }
.sync[data-state="saving"] { color: var(--ink); }
.sync[data-state="saved"] { color: var(--good); }
.sync[data-state="failed"] { color: var(--bad); font-weight: 700; }
.note { border-left: 6px solid var(--accent); background: var(--sunk); padding: 10px 12px; font-size: 14px; }

.label { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; display: flex; gap: 10px; align-items: baseline; }
.label::before { content: attr(data-n); color: var(--accent); font-variant-numeric: tabular-nums; }


/* Cube */
.stage { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.scene {
  --size: min(74vw, 320px);
  width: var(--size); height: var(--size);
  perspective: 1100px; touch-action: none; user-select: none; -webkit-user-select: none;
  margin: 30px 0 22px;
}
.cube { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform var(--spin, .6s) cubic-bezier(.17,1.18,.32,1); will-change: transform; }
.cube.dragging { transition: none; }
.scene { cursor: grab; position: relative; }
.scene:active { cursor: grabbing; }
.scene::after { content: ''; position: absolute; left: 14%; right: 14%; bottom: -30px; height: 14px; border-radius: 50%; background: var(--ink); opacity: .12; pointer-events: none; }
.face {
  position: absolute; inset: 0; padding: 10px;
  display: grid; grid-template-rows: auto 1fr; gap: 8px;
  background: var(--fc); color: var(--fi);
  backface-visibility: hidden;
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--fi) 25%, transparent);
}
.face-0 { transform: translateZ(calc(var(--size) / 2)); }
.face-1 { transform: rotateY(90deg) translateZ(calc(var(--size) / 2)); }
.face-2 { transform: rotateY(180deg) translateZ(calc(var(--size) / 2)); }
.face-3 { transform: rotateY(-90deg) translateZ(calc(var(--size) / 2)); }
.face-4 { transform: rotateX(90deg) translateZ(calc(var(--size) / 2)); }
.face-5 { transform: rotateX(-90deg) translateZ(calc(var(--size) / 2)); }
.face-name { display: flex; align-items: baseline; gap: 8px; font-family: var(--display); font-weight: 800; font-size: 17px; letter-spacing: -.01em; line-height: 1.1; border-bottom: var(--rule) solid currentColor; padding-bottom: 6px; }
.face-name i { font-style: normal; font-size: 12px; font-weight: 700; font-family: var(--body); letter-spacing: .06em; }
.cells { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 6px; min-height: 0; }
.cell-tile {
  border: 0; padding: 7px 8px; text-align: left; min-width: 0;
  background: color-mix(in srgb, var(--fi) 13%, transparent); color: inherit;
  display: flex; flex-direction: column; justify-content: space-between; gap: 4px;
}
.cell-tile:hover { background: color-mix(in srgb, var(--fi) 24%, transparent); }
.cell-tile em { font-style: normal; font-size: 11px; font-weight: 700; opacity: .8; font-variant-numeric: tabular-nums; }
.cell-tile strong { font-size: 14px; font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; }
.cell-tile small { font-size: 12px; opacity: .85; }


/* All spaces (non-3D route) */
.grid { display: flex; flex-direction: column; gap: 0; }
.g-face { border-top: var(--rule) solid var(--line); padding: 12px 0 16px; display: grid; grid-template-columns: 10px 1fr; gap: 10px 14px; }
.g-face::before { content: ''; background: var(--fc); grid-row: 1 / span 2; }
.g-head { display: flex; align-items: baseline; gap: 10px; }
.g-head span { font-size: 12px; font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.g-head h3 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: -.02em; flex: 1; min-width: 0; }
.g-cells { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-top: 1px solid var(--hair); }
.g-cell { border: 0; border-bottom: 1px solid var(--hair); background: transparent; padding: 10px 8px 10px 0; text-align: left; display: grid; grid-template-columns: 26px 1fr; gap: 0 6px; min-width: 0; }
.g-cell:nth-child(odd) { border-right: 1px solid var(--hair); }
.g-cell:nth-child(even) { padding-left: 10px; }
.g-cell em { font-style: normal; font-size: 12px; font-weight: 700; color: var(--accent); grid-row: 1 / span 2; padding-top: 2px; font-variant-numeric: tabular-nums; }
.g-cell strong { font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
.g-cell small { color: var(--ink-2); font-size: 13px; }
.g-cell:hover strong { text-decoration: underline; text-underline-offset: 3px; }

/* Shared bits */
.card { border-top: var(--rule) solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 12px; }
.icon-btn { border: var(--rule) solid var(--line); background: transparent; min-width: 40px; height: 36px; padding: 0 10px; font-size: 13px; font-weight: 700; }
.icon-btn:hover { background: var(--ink); color: var(--bg); }
.field { width: 100%; border: var(--rule) solid var(--line); background: var(--bg); border-radius: 0; padding: 10px 12px; font-size: 16px; }
.field:focus { outline: none; box-shadow: inset 0 0 0 2px var(--accent); border-color: var(--accent); }
textarea.field { min-height: 120px; resize: vertical; font-size: 16px; font-family: ui-monospace, Consolas, monospace; }
select.field { padding: 8px 10px; font-size: 16px; }
.edit-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; width: 100%; }
.edit-row .field { flex: 1 1 200px; }
.btn { border: var(--rule) solid var(--ink); padding: 9px 16px; font-weight: 700; background: var(--ink); color: var(--bg); }
.btn:hover { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--on-accent); }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.ghost:hover { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn:disabled { opacity: .45; cursor: default; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.editable { border: 0; background: transparent; padding: 2px 4px; margin: -2px -4px; text-align: left; color: inherit; font: inherit; overflow-wrap: anywhere; }
.editable:hover { background: var(--sunk); }

/* Space */
.crumb { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 8px; background: var(--fc); color: var(--fi); padding: 6px 12px; font-size: 13px; font-weight: 700; }
.area-num { margin: 0; font-family: var(--display); font-weight: 900; font-size: 64px; line-height: .85; letter-spacing: -.05em; color: var(--accent); font-variant-numeric: tabular-nums; }
.area-title { margin: 0; font-family: var(--display); font-weight: 900; font-size: 36px; line-height: 1.02; letter-spacing: -.035em; text-wrap: balance; }
.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: var(--rule) solid var(--line); }
.items:empty { border-top: 0; }

/* Identity and time */
.me { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: space-between; border: var(--rule) solid var(--line); padding: 8px 10px; }
.me-who { font-size: 14px; font-weight: 700; }
.clock { display: flex; align-items: center; gap: 10px; }
.clock-time { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 16px; }
.dot { width: 10px; height: 10px; background: var(--hair); display: inline-block; }
.dot.on { background: var(--good); }
.dot.away { background: var(--away); }
.team { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.team li { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; }
.team li + li { border-top: 1px solid var(--hair); }
.team b { font-weight: 700; }
.team small { display: block; color: var(--ink-2); font-size: 13px; }
.team small.role { color: var(--accent); font-weight: 600; font-size: 12px; letter-spacing: .01em; }
.team .nums { text-align: right; font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 700; }
.team .nums small { font-weight: 400; }
.space-time { font-size: 14px; color: var(--ink-2); margin: 0; }
.fine { font-size: 13px; color: var(--ink-2); margin: 0; }
.away-box { display: flex; flex-direction: column; gap: 10px; }
.away-box div { display: flex; gap: 8px; flex-wrap: wrap; }
.item-main { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.item-text { font-size: 16px; white-space: pre-wrap; }
.item-main a { color: var(--accent); overflow-wrap: anywhere; font-size: 14px; font-weight: 700; }
.x { border: 0; background: transparent; color: var(--ink-2); width: 36px; height: 36px; font-size: 16px; }
.x:hover { background: var(--bad-fill); color: var(--on-bad); }
.empty { color: var(--ink-2); font-size: 15px; padding: 8px 0; margin: 0; }
.err { color: var(--bad); font-size: 14px; font-weight: 700; margin: 0; }
.leftover { display: flex; flex-direction: column; gap: 8px; }
.ok { color: var(--good); font-size: 14px; font-weight: 700; margin: 0; }
.recent { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.recent li + li { border-top: 1px solid var(--hair); }
.recent button { width: 100%; border: 0; background: transparent; text-align: left; padding: 10px 0; display: flex; flex-direction: column; gap: 2px; }
.recent b { font-weight: 500; overflow-wrap: anywhere; }
.recent small { color: var(--ink-2); font-size: 13px; }
.toast { position: fixed; left: 16px; right: 16px; bottom: 18px; margin: 0 auto; max-width: 480px; background: var(--ink); color: var(--bg); border-left: 6px solid var(--accent); padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 15px; z-index: 10; }
/* Said inside a sheet (an answer in For you): shown over it, under the login, and never in the way of
   the sheet's own controls (a tap goes through). A toast with Undo is never raised: it belongs to the page. */
.toast.over { z-index: 22; pointer-events: none; }
.toast button { border: 0; background: transparent; color: inherit; font-weight: 700; text-decoration: underline; padding: 6px; }
@media (prefers-reduced-motion: reduce) { .cube, .todo { transition: none; } }

/* To-do rows: tick, short text, owner, swipe sideways to remove */
.row-wrap { position: relative; overflow: hidden; border-bottom: 1px solid var(--hair); }
.row-wrap:has(.swiping) { background: var(--bad-fill); }
.row-wrap::before, .row-wrap::after { content: attr(data-del); position: absolute; top: 0; bottom: 0; display: none; align-items: center; color: var(--on-bad); font-weight: 700; font-size: 14px; }
.row-wrap:has(.swiping)::before, .row-wrap:has(.swiping)::after { display: flex; }
.row-wrap::before { left: 16px; } .row-wrap::after { right: 16px; }
.todo { position: relative; z-index: 1; background: var(--bg); padding: 10px 0; display: grid; grid-template-columns: 28px 1fr auto auto; gap: 10px; align-items: center; touch-action: pan-y; transition: transform .28s cubic-bezier(.2,.9,.3,1); }
.todo.swiping { transition: none; }
.todo input[type="checkbox"] { width: 22px; height: 22px; margin: 0 0 0 2px; accent-color: var(--ink); }
.todo.done .item-text { text-decoration: line-through; color: var(--ink-2); }
.who { width: 32px; height: 32px; border: var(--rule) dashed var(--hair); background: transparent; color: var(--ink-2); font-weight: 700; font-size: 14px; display: grid; place-items: center; }
.who[data-who="vida"], .who[data-who="anand"], .who[data-who="obama"] { color: var(--p-ink); border-style: solid; border-color: transparent; }
.who[data-who="vida"] { background: var(--p-vida); }
.who[data-who="anand"] { background: var(--p-anand); }
.who[data-who="obama"] { background: var(--p-obama); }
.add-row { display: flex; gap: 0; }
.add-row .field { flex: 1; border-right: 0; }

/* Data: export and import */
.data-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 620px) { .data-grid { grid-template-columns: 1fr 1fr; } }
.data-grid section { display: flex; flex-direction: column; gap: 10px; }
.data-grid h4 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: -.02em; }
.file-btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.file-btn:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }
.file-btn:has(input:disabled) { opacity: .45; }
.file-btn:has(input:disabled) input { cursor: default; }
.plan { list-style: none; margin: 0; padding: 0; border-top: var(--rule) solid var(--line); }
.plan li { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--hair); font-size: 14px; }
.plan b { font-variant-numeric: tabular-nums; }

/* Dependencies: status is always written out, never colour alone */
.flow-tag { font-size: 12px; font-weight: 700; letter-spacing: .01em; }
.flow-tag.blocked { color: var(--bad); }
.flow-tag.blocking { color: var(--away); }
.dep-edit { flex: 1 1 100%; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; border-top: 1px solid var(--hair); padding-top: 8px; }
.dep-label { flex: 1 1 100%; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.dep-chip { display: inline-flex; align-items: center; gap: 4px; background: var(--sunk); padding: 4px 4px 4px 10px; font-size: 13px; }
.dep-chip button { border: 0; background: transparent; width: 28px; height: 28px; color: var(--ink-2); }
.dep-edit .field { flex: 1 1 100%; }
#planView { display: flex; flex-direction: column; gap: 16px; }
.gfilters { display: grid; grid-template-columns: repeat(5, 1fr); border: var(--rule) solid var(--line); }
.gfilter { border: 0; border-right: 1px solid var(--hair); background: var(--bg); padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.gfilter:last-child { border-right: 0; }
.gfilter b { font-family: var(--display); font-weight: 900; font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums; }
.gfilter span { font-size: 11px; font-weight: 700; text-align: center; overflow-wrap: anywhere; }
.gfilter[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.gfilter.s-blocked b { color: var(--bad); } .gfilter.s-blocking b { color: var(--away); } .gfilter.s-done b { color: var(--good); }
.gfilter[aria-pressed="true"] b { color: inherit; }
.gfilter:focus-visible { outline: 3px solid currentColor; outline-offset: -5px; }
.gdetail { display: flex; flex-direction: column; gap: 6px; }

/* ── Friendly layer: shapes, light and motion on top of the layout above ── */
body { background: radial-gradient(130% 42% at 50% 0%, var(--glow), transparent 70%) no-repeat, var(--bg); }
.mark { font-weight: 900; letter-spacing: -.035em; font-size: clamp(48px, 14vw, 84px); line-height: .9; }
.mark::after { border-radius: 50%; width: .15em; height: .15em; background: radial-gradient(circle at 35% 35%, #FFFFFF 0 18%, var(--warm) 60%); box-shadow: 0 0 14px var(--warm); animation: twinkle 3.2s ease-in-out infinite; }
@keyframes twinkle { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.25); } }
.note { border-left: 0; border-radius: var(--r); padding: 14px 16px; font-size: 15px; box-shadow: var(--shadow); }
.label { font-weight: 700; letter-spacing: .08em; color: var(--ink-2); }
.label::before { color: var(--accent); }
.face { border-radius: 22px; background: linear-gradient(150deg, color-mix(in srgb, var(--fc) 62%, #FFFFFF) 0%, var(--fc) 46%, color-mix(in srgb, var(--fc) 86%, #000000) 100%);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.55), inset 0 -4px 0 rgba(0,0,0,.08); }
.face-name { font-weight: 900; font-size: 19px; letter-spacing: -.01em; border-bottom: 0; }
.cell-tile { border-radius: 14px; background: color-mix(in srgb, #FFFFFF 34%, transparent); box-shadow: 0 2px 0 rgba(0,0,0,.06); }
.cell-tile:hover { background: color-mix(in srgb, #FFFFFF 50%, transparent); }
.cell-tile:focus-visible { outline: 3px solid var(--fi); outline-offset: 2px; }
.scene::after { filter: blur(6px); opacity: .18; }
.g-head h3, .area-title, .data-grid h4, .face-name, .gfilter b { font-weight: 900; letter-spacing: -.02em; }
.g-face { border-top: 0; background: var(--sunk); border-radius: var(--r); padding: 14px 16px 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
.g-face::before { border-radius: 999px; }
.g-head h3 { font-size: 23px; }
.g-cells { border-top: 0; }
.g-cell em { color: var(--accent); }
.card { border-top: 0; background: var(--sunk); border-radius: var(--r); padding: 18px 16px; box-shadow: var(--shadow); }
.card .todo { background: var(--sunk); }
.icon-btn { border: 0; border-radius: 999px; background: var(--sunk); font-weight: 600; box-shadow: var(--shadow); }
.icon-btn:hover { background: var(--accent-fill); color: var(--on-accent); }
.field { border: 1px solid transparent; border-radius: var(--r-sm); padding: 12px 14px; background: color-mix(in srgb, var(--ink) 6%, var(--sunk)); }
.field:focus { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); border-color: var(--accent); background: var(--sunk); }
.btn { border: 0; background: var(--accent-fill); color: var(--on-accent); border-radius: 999px; padding: 12px 20px; font-weight: 600; box-shadow: 0 4px 14px color-mix(in srgb, var(--accent-fill) 30%, transparent); }
.btn:hover { background: color-mix(in srgb, var(--accent-fill) 86%, #000000); color: var(--on-accent); }
.btn.ghost { background: color-mix(in srgb, var(--ink) 7%, transparent); color: var(--ink); box-shadow: none; }
.btn.ghost:hover { background: color-mix(in srgb, var(--ink) 12%, transparent); color: var(--ink); }
.editable { border-radius: 8px; }
.chip { border-radius: 999px; padding: 6px 14px; font-weight: 700; }
.area-num { font-family: var(--display); font-weight: 900; font-size: 60px; letter-spacing: -.03em; color: var(--accent); }
.area-title { font-size: 38px; line-height: 1.05; }
.items { border-top: 0; background: var(--sunk); border-radius: var(--r); padding: 0 14px; box-shadow: var(--shadow); }
.items:empty { padding: 0; box-shadow: none; }
.items .row-wrap:last-child { border-bottom: 0; }
.items .todo { background: var(--sunk); }
.me { border: 0; background: var(--sunk); border-radius: var(--r); padding: 10px 12px 10px 16px; box-shadow: var(--shadow); }
.dot { border-radius: 50%; }
.dot.on { box-shadow: 0 0 0 0 var(--good); animation: breathe 2.4s ease-out infinite; }
@keyframes breathe { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 55%, transparent); } 100% { box-shadow: 0 0 0 9px transparent; } }
.who { border-radius: 50%; border-width: 1.5px; }
.add-row { gap: 8px; }
.add-row .field { border-right: 1px solid transparent; }
.add-row .field:focus { border-color: var(--accent); }
.todo input[type="checkbox"] { accent-color: var(--accent); width: 24px; height: 24px; }
.x { border-radius: 50%; }
.toast { border-left: 0; border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 16px; animation: rise .5s var(--spring) both; }
@keyframes rise { from { transform: translateY(30px) scale(.9); opacity: 0; } }
.data-grid h4 { font-size: 22px; }
.plan { border-top: 1px solid var(--hair); }
.dep-chip { border-radius: 999px; background: color-mix(in srgb, var(--ink) 7%, transparent); }
.dep-label { font-weight: 700; }
.gfilters { border: 0; border-radius: var(--r-sm); overflow: hidden; background: var(--sunk); box-shadow: var(--shadow); }
.gfilter { background: var(--sunk); }
.gfilter[aria-pressed="true"] { background: var(--accent-fill); color: var(--on-accent); }

/* Plan views: plan picker, layer labels, loops, build order */
.gchips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
.gchip { flex: 0 0 auto; border: 0; border-radius: 999px; padding: 9px 14px; font-size: 14px; font-weight: 600; white-space: nowrap; background: color-mix(in srgb, var(--ink) 7%, transparent); color: var(--ink); }
.gchip[aria-pressed="true"] { background: var(--accent-fill); color: var(--on-accent); }
details.build > summary { cursor: pointer; list-style: none; padding: 2px 0; }
details.build > summary::-webkit-details-marker { display: none; }
details.build > summary::after { content: '＋'; margin-left: auto; color: var(--ink-2); }
details.build[open] > summary::after { content: '－'; }
.build-list { counter-reset: step; }
.build-list li { counter-increment: step; }
.build-list button { padding-left: 34px; position: relative; }
.build-list button::before { content: counter(step); position: absolute; left: 0; top: 10px; width: 26px; text-align: right; font-size: 12px; font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* Top bar: the wordmark, the language, updates, chat, and the person (who opens the menu). The
   home screen below it is the cube alone; everything else lives in the menu. */
.top { position: sticky; top: 0; z-index: 6; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  margin: -18px -16px -8px; padding: 12px 16px 10px; background: color-mix(in srgb, var(--bg) 86%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px); }
.top .mark { font-size: 30px; line-height: 1; letter-spacing: -.03em; white-space: nowrap; }
/* Focus moved up a long list lands below the sticky bar (and the status line under it), never behind it. */
html { scroll-padding-top: 84px; }
.top-tools { display: flex; align-items: center; gap: 8px; }
.tool { position: relative; min-width: 40px; height: 40px; padding: 0 12px; display: inline-grid; place-items: center; border-radius: 999px; }
.tool.icon { width: 40px; padding: 0; }
.tool svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.badge { position: absolute; top: -5px; right: -5px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 999px; background: var(--bad-fill); color: var(--on-bad); font: 700 11px/19px var(--body); text-align: center; box-shadow: 0 0 0 2px var(--bg); animation: pop .5s var(--spring) both; }
@keyframes pop { from { transform: scale(.3); } }
.avatar { position: relative; width: 40px; height: 40px; border: 0; border-radius: 50%; display: grid; place-items: center; font: 900 17px/1 var(--display); background: var(--ink); color: var(--bg); }
.avatar[data-who="vida"], .avatar[data-who="anand"], .avatar[data-who="obama"] { color: var(--p-ink); }
.avatar[data-who="vida"] { background: var(--p-vida); } .avatar[data-who="anand"] { background: var(--p-anand); } .avatar[data-who="obama"] { background: var(--p-obama); }
/* The timer's state on the person, by shape as well as colour (the label says it in words): a filled
   dot while it runs, a ring while away, nothing when stopped. */
.avatar i { display: none; position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 0 2px var(--bg); }
.avatar i.on { display: block; background: var(--good); } .avatar i.away { display: block; background: var(--bg); box-shadow: inset 0 0 0 3px var(--away), 0 0 0 2px var(--bg); }
/* The status line hangs under the bar; on its own background it stays readable over the glow and over
   rows scrolling under it. */
.sync { position: absolute; left: 10px; top: calc(100% - 6px); font-size: 12px; min-height: 0; padding: 0 6px; border-radius: 999px; background: var(--bg); }
/* Home is the cube alone, on one screen: 132px is the rest of the page (padding, the bar, the gap). */
#home { display: grid; place-items: center; min-height: calc(100dvh - 132px); }
#home .scene { --size: min(80vw, 380px, 54dvh); margin: 8px 0 44px; }
#home .stage { gap: 0; }

/* Sheets: the menu, updates and chat slide up over the page; Escape or ✕ closes them. */
.sheet-back { position: fixed; inset: 0; z-index: 20; background: rgba(1, 4, 9, .38); animation: fade .25s both; }
@keyframes fade { from { opacity: 0; } }
.sheet { position: fixed; z-index: 21; left: 0; right: 0; bottom: 0; max-width: 560px; max-height: calc(100dvh - 20px); margin: 0 auto;
  display: flex; flex-direction: column; background: var(--bg); border-radius: 26px 26px 0 0; box-shadow: 0 -8px 40px rgba(0, 0, 0, .22); animation: sheetUp .5s var(--spring) both; }
@keyframes sheetUp { from { transform: translateY(36%); opacity: .4; } }
@media (min-width: 720px) { .sheet { bottom: auto; top: 5vh; max-height: 90vh; border-radius: 26px; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 16px 12px; border-bottom: 1px solid var(--hair); }
.sheet-title { margin: 0; font: 900 25px/1.1 var(--display); letter-spacing: -.02em; }
.sheet-body { overflow: auto; padding: 16px 16px 28px; display: flex; flex-direction: column; gap: 16px; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.x-btn { flex: 0 0 auto; width: 40px; height: 40px; border: 0; border-radius: 50%; background: color-mix(in srgb, var(--ink) 8%, transparent); font-size: 16px; }
/* A failed save, said at the top of the sheet that covers the status line. */
.sheet > .save-err { padding: 10px 16px 0; }
body.locked { overflow: hidden; }
.sheet .card { box-shadow: none; background: var(--sunk); padding: 14px; }
.sheet details.card > summary { cursor: pointer; list-style: none; }
.sheet details.card > summary::-webkit-details-marker { display: none; }
.sheet details.card > summary::after { content: '＋'; margin-left: auto; color: var(--ink-2); }
.sheet details.card[open] > summary::after { content: '－'; }
.me-row { display: grid; grid-template-columns: 48px 1fr; gap: 12px; align-items: center; }
.me-row .who { width: 48px; height: 48px; font: 900 20px/1 var(--display); }
.me-row b { display: block; font: 800 19px/1.15 var(--display); }
.me-row small { display: block; color: var(--accent); font-size: 13px; font-weight: 600; }
.me { box-shadow: none; padding: 10px 0 0; background: transparent; }
.settings .btns { align-items: center; }
.city { border: 0; background: transparent; padding: 0; color: var(--ink-2); font-size: 13px; text-align: left; text-decoration: underline dotted; text-underline-offset: 3px; }
.team small.lt { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.tr-line { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 14px; color: var(--ink-2); margin: 0; }

/* Updates and chat */
.upd { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.upd li + li { border-top: 1px solid var(--hair); }
.upd button { width: 100%; display: grid; grid-template-columns: 32px 1fr; gap: 10px; align-items: start; text-align: left; border: 0; background: transparent; padding: 10px 0; color: inherit; }
.upd b { font-weight: 600; overflow-wrap: anywhere; } .upd small { display: block; color: var(--ink-2); font-size: 13px; }
.upd .new { color: var(--accent); font-weight: 700; }
.wclock { display: flex; gap: 6px; overflow-x: auto; padding: 8px 16px; border-bottom: 1px solid var(--hair); scrollbar-width: none; }
.wc { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 999px; background: var(--sunk); font-size: 13px; white-space: nowrap; box-shadow: inset 0 0 0 1px var(--hair); }
.wc .who { width: 24px; height: 24px; font-size: 12px; }
.wc b { font-variant-numeric: tabular-nums; }
.chat { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.msg { display: grid; grid-template-columns: 30px 1fr; gap: 8px; align-items: end; max-width: 88%; }
.msg .who { width: 30px; height: 30px; font-size: 13px; }
.msg.mine { margin-left: auto; grid-template-columns: 1fr; }
.bubble { background: var(--sunk); border-radius: 18px 18px 18px 6px; padding: 8px 12px; box-shadow: var(--shadow); min-width: 0; }
.msg.mine .bubble { background: var(--accent-fill); color: var(--on-accent); border-radius: 18px 18px 6px 18px; }
.bubble small { display: block; font-size: 12px; font-weight: 600; color: var(--ink-2); margin-bottom: 2px; }
.msg.mine .bubble small { color: var(--on-accent); }   /* plain white on --accent-fill: 4.5:1 in both themes */
.bubble p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.day-sep { text-align: center; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.chat-form { display: flex; gap: 8px; align-items: flex-end; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--hair); }
.chat-form textarea.field { flex: 1; min-height: 46px; max-height: 140px; resize: none; font-family: var(--body); }
#chatErr { padding: 0 16px 8px; }
.chat-ro { margin: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--hair); overflow-wrap: anywhere; }
.chat-ro a, .me-ro a { color: var(--accent); font-weight: 700; }
.me-ro { margin: 10px 0 0; overflow-wrap: anywhere; }
/* Read by screen readers, not shown: the chat's line for a message that just came in. */
.vh { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
.ping-box { position: fixed; z-index: 15; top: 66px; left: 16px; right: 16px; max-width: 480px; margin: 0 auto; pointer-events: none; }
.ping { pointer-events: auto; width: 100%; display: grid; grid-template-columns: 32px 1fr; gap: 10px; align-items: center; text-align: left; border: 0; border-radius: var(--r); padding: 10px 14px; background: var(--sunk); color: var(--ink); box-shadow: var(--shadow), 0 0 0 1px var(--hair); font-size: 14px; animation: drop .55s var(--spring) both; }
.ping span:not(.who) { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
@keyframes drop { from { transform: translateY(-24px) scale(.94); opacity: 0; } }

/* Login: pick who you are */
.login { position: fixed; inset: 0; z-index: 30; overflow: auto; display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 32px 16px 36px;
  background: radial-gradient(130% 60% at 50% 0%, var(--glow), transparent 70%) no-repeat, var(--bg); }
.login .mark { font-size: clamp(56px, 18vw, 96px); }
.login h2 { margin: 0; font: 900 28px/1.1 var(--display); letter-spacing: -.02em; text-align: center; outline: none; }
/* Ink, not grey: the glow and the cards' shadow behind these lines would take grey under 4.5:1. */
.login p { margin: 0; max-width: 380px; text-align: center; color: var(--ink); font-size: 15px; }
.login-cards { width: 100%; max-width: 440px; display: grid; gap: 12px; }
.login-card { display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center; text-align: left; border: 0; border-radius: var(--r); padding: 14px 16px; background: var(--sunk); color: var(--ink); box-shadow: var(--shadow); transition: transform .45s var(--spring); }
.login-card:active { transform: scale(.96); transition-duration: .08s; }
.login-card .who { width: 56px; height: 56px; font: 900 24px/1 var(--display); }
.login-card b { display: block; font: 800 21px/1.15 var(--display); }
.login-card small { display: block; color: var(--ink-2); font-size: 13px; }
.login-card small.role { color: var(--accent); font-weight: 600; }
.login-card .lt { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.login-foot { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
/* Sign-in (the Vercel copy, with the team's database): email and password in the same box. */
.signin { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 8px; }
.signin label, .pw-form label { font-size: 14px; font-weight: 600; color: var(--ink); }
.signin .btn { width: 100%; margin-top: 10px; }
.login .err { color: var(--bad); }
.acct { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--hair); padding-top: 12px; }
.acct .fine { overflow-wrap: anywhere; }
.pw-form { display: flex; flex-direction: column; gap: 8px; }
.note a { color: var(--accent); font-weight: 700; overflow-wrap: anywhere; }

/* The plan graph, drawn like a printed project chart: paper that follows the theme, a light band
   behind every other milestone group (Timeline) or layer (Dependency graph), a date ruler with
   today marked, and neutral to-do cards with a status icon and word and the owner's initial. One
   accent colour picks out the to-dos holding others up now and the links out of them; red is kept
   for what is late, Behind and loops. Milestone headers and nodes carry their date, days left or
   late, and a bar of how much they need is done. Hover styles live in @media (hover: hover), so a
   tap on a phone leaves nothing stuck; reduced motion turns the few transitions off. */
.flow { position: relative; border-radius: var(--r-sm); overflow: hidden; background: var(--sunk); color: var(--ink); font-family: var(--body); box-shadow: var(--shadow); }
.flow-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 14px; border-bottom: 1px solid var(--g-rule); background: var(--sunk); }
.flow-sum { flex: 1 1 210px; min-width: 0; max-width: 460px; display: flex; flex-direction: column; gap: 6px; }
/* "Done 2/41 · 5%": the word is a quiet label, the numbers are plain. */
.flow-sum b { display: block; font: 600 15px/1.25 var(--body); font-variant-numeric: tabular-nums; color: var(--ink); }
.flow-sum b .k { margin-right: 1px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.flow-sum > span { font-size: 13px; font-weight: 600; line-height: 1.3; }
.flow-sum .warn { color: var(--g-bad); } .flow-sum .ok { color: var(--ink); } .flow-sum .dim { color: var(--g-ink-2); font-weight: 500; }
.flow-meter, .gb-prog i { display: block; height: 6px; border-radius: 3px; background: linear-gradient(var(--g-bar), var(--g-bar)) 0 0 / var(--p, 0%) 100% no-repeat, var(--g-rule); }
.zoom { display: inline-flex; align-items: center; border: 1px solid var(--g-rule-2); border-radius: 8px; background: var(--sunk); }
.zoom span { min-width: 46px; text-align: center; font: 600 12px/1 var(--body); font-variant-numeric: tabular-nums; color: var(--g-ink-2); }
.zoom button, .flow-btn { border: 0; background: transparent; color: var(--ink); min-width: 40px; height: 38px; border-radius: 7px; font: 600 17px/1 var(--body); transition: background-color .15s ease; }
.flow-btn { padding: 0 14px; font-size: 13px; border: 1px solid var(--g-rule-2); border-radius: 8px; background: var(--sunk); }
.zoom button:focus-visible, .flow-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.flow .gfilters { flex: 1 1 320px; max-width: 560px; border: 1px solid var(--g-rule-2); border-radius: 10px; background: var(--sunk); box-shadow: none; }
.flow .gfilter { --g-fill: var(--sunk); background: transparent; border-right: 1px solid var(--g-rule); padding: 7px 2px 6px; gap: 3px; transition: background-color .15s ease; }
.flow .gfilter:last-child { border-right: 0; }
.flow .gfilter:active { transform: none; }
.flow .gfilter b { display: inline-flex; align-items: center; gap: 5px; font: 700 18px/1.1 var(--body); letter-spacing: 0; color: var(--ink); }
.flow .gfilter span { font-size: 11px; font-weight: 600; color: var(--g-ink-2); }
.flow .gfilter .gi { color: var(--g-ink-2); }
.flow .gfilter.s-blocking .gi { color: var(--g-acc); }
.flow .gfilter.s-blocking b, .flow .gfilter.s-blocking span { color: var(--g-acc); }
/* The chosen filter: a light tint with an accent underline, its words in ink. */
.flow .gfilter[aria-pressed="true"] { --g-fill: color-mix(in srgb, var(--ink) 6%, var(--sunk)); background: var(--g-fill); box-shadow: inset 0 -2px 0 var(--accent); }
.flow .gfilter[aria-pressed="true"] b, .flow .gfilter[aria-pressed="true"] span { color: var(--ink); }
.flow .gfilter:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; }
.flow-scroll { overflow: auto; height: min(68dvh, 660px); min-height: 300px; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; background: var(--g-paper); }
.flow-scroll:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.flow-zoom { position: relative; }
.graph-canvas { position: absolute; left: 14px; top: 14px; transform-origin: 0 0; }
/* The axis under the ruler (dates on the Timeline, layer names on the Dependency graph). */
.graph-canvas::before { content: ''; position: absolute; z-index: 1; left: -14px; right: -14px; top: 26px; height: 1px; background: var(--g-rule-2); pointer-events: none; }
.gedges { position: absolute; left: 0; top: 0; z-index: 2; overflow: visible; pointer-events: none; }
.gedge { fill: none; stroke: var(--g-edge-quiet); stroke-width: 1; stroke-linecap: round; }
.gedge.live { stroke: var(--g-edge); stroke-width: 1.5; }
.gedge.hot { stroke: var(--accent); stroke-width: 1.75; }
.gedge.far { opacity: .5; }
.gedge.dim { opacity: .12; }
.glayer, .gband { position: absolute; top: 0; bottom: 0; z-index: 0; pointer-events: none; }
.glayer { font: 600 11.5px/26px var(--body); color: var(--g-ink-2); white-space: nowrap; }
.glayer::before, .gband::before { content: ''; position: absolute; z-index: -1; top: -14px; bottom: -14px; left: calc(-1 * var(--ext, 22px)); right: calc(-1 * var(--ext, 22px)); }

/* The milestone's name: up to two lines, which still fit above the cards (top 100). */
.gb-name { margin-top: 26px; font: 700 13px/1.25 var(--body); color: var(--ink); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.gb-prog { margin-top: 7px; display: flex; align-items: center; gap: 8px; white-space: nowrap; font: 600 11.5px/1.2 var(--body); font-variant-numeric: tabular-nums; color: var(--g-ink-2); }
.gb-prog i { flex: 1 1 auto; min-width: 40px; }
/* Today: a thin rule with a small paper label on the ruler. */
.gtoday { position: absolute; z-index: 1; top: -14px; bottom: -14px; width: 0; border-left: 1px solid var(--g-edge); pointer-events: none; }
.gtoday span { position: absolute; top: 31px; left: -.5px; transform: translateX(-50%); padding: 2px 6px; border: 1px solid var(--g-rule-2); border-radius: 4px; background: var(--g-paper); color: var(--ink);
  font: 600 11px/1.2 var(--body); font-variant-numeric: tabular-nums; white-space: nowrap; }
.gtoday.start span { transform: none; left: -1px; } .gtoday.end span { transform: translateX(-100%); left: 0; }
/* A card. --g-fill is its colour, and the cut-outs of its status icon take the same colour. A to-do
   card holds its status row (18px) and two lines of words (31.2px) inside its 64px. */
.gnode { --g-fill: var(--g-node); position: absolute; z-index: 3; display: flex; flex-direction: column; gap: 2px; padding: 5px 9px 5px 12px; overflow: hidden; text-align: left;
  border: 1px solid var(--g-rule-2); border-radius: 6px; background: var(--g-fill); color: var(--ink); font-family: var(--body); transition: border-color .15s ease, background-color .15s ease; }
.gnode::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
.gnode.s-blocking { border-color: color-mix(in srgb, var(--accent) 45%, var(--g-rule-2)); }
.gnode.s-blocking::before { background: var(--accent); }
.gnode.s-done { --g-fill: var(--g-node-done); border-color: var(--g-rule); }
.gnode small { display: flex; align-items: center; gap: 5px; min-height: 18px; white-space: nowrap; overflow: hidden; font: 600 11.5px/1.2 var(--body); letter-spacing: .01em; color: var(--g-ink-2); }
.gnode small .sw { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.gnode.s-blocking small { color: var(--g-acc); }
.gnode .t { flex: 0 0 auto; font: 500 13px/1.2 var(--body); color: var(--ink); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.gnode.s-done .t { color: var(--g-ink-2); text-decoration: line-through; text-decoration-color: var(--g-edge); }

.gi .cut { fill: var(--g-fill, var(--g-node)); }
.gi .cut-ln { fill: none; stroke: var(--g-fill, var(--g-node)); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.ms-txt em .gi { vertical-align: -1.5px; }
.gnode.loop small .gi { color: var(--g-bad); }
.own { margin-left: auto; flex: 0 0 18px; width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; border: 1px solid var(--g-rule-2); background: transparent;
  color: var(--ink); font: 600 11px/1 var(--body); letter-spacing: 0; }
/* A milestone: up to two lines of its words, its date state and count, then its progress bar. */
.gnode.ms { justify-content: center; gap: 4px; padding: 6px 10px 6px 12px; border: 1px solid var(--ink); }
.gnode.ms::before { background: var(--ink); }
.gnode.ms.s-done { border-color: var(--g-edge); }
.gnode.ms.s-done::before { background: var(--g-edge); }
.ms-txt { min-width: 0; display: flex; flex-direction: column; gap: 2px; }

.ms-row { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; white-space: nowrap; }
.ms-txt em { flex: none; font: 600 12px/1.2 var(--body); font-style: normal; color: var(--g-ink-2); }
.ms-txt i { min-width: 0; overflow: hidden; text-overflow: ellipsis; font: 500 12px/1.2 var(--body); font-style: normal; font-variant-numeric: tabular-nums; color: var(--g-ink-2); }
svg.ring { display: block; width: 100%; height: 12px; flex: 0 0 12px; overflow: visible; }
.ring-track { fill: var(--g-rule); }
.ring-arc { fill: var(--g-bar); }
.ring-text { fill: var(--g-ink-2); font: 600 11px var(--body); font-variant-numeric: tabular-nums; }
/* A loop is the one dashed card, in red. Blocked cards keep the solid border: their word says it. */
.gnode.loop { border: 1.5px dashed var(--g-bad); }
@media (hover: hover) {

  .flow .gnode.dim:hover { border-color: var(--g-rule-2); box-shadow: none; }

}
/* Out of the picked chain or the filter: an outline with no fill of its own (it takes the colour of
   its column, so links behind it stay hidden) and grey words that still pass 4.5:1. Only the side

.flow .gnode.dim.alt { --g-fill: var(--g-band); }
.flow .gnode.dim::before { opacity: .3; }
.flow .gnode.dim :is(small, .t, .ms-txt b, .ms-txt em, .ms-txt i, .own) { color: var(--g-ink-2); }
.flow .gnode.dim .own { border-color: var(--g-rule); }
.flow .gnode.dim :is(.ring-track, .ring-arc) { opacity: .35; }
/* While some cards are dimmed (.focus), the cards in the chain or the filter take an ink outline, and
   a done one ink words, so a dimmed card never looks like a match. The picked card keeps its accent
   ring, and a loop its red dashes. */
.graph-canvas.focus .gnode:not(.dim):not(.loop):not([aria-pressed="true"]) { border-color: var(--ink); }
.graph-canvas.focus .gnode.s-done:not(.dim) .t { color: var(--ink); }
.gnode[aria-pressed="true"] { --g-fill: var(--g-wash); border-color: var(--accent); box-shadow: 0 0 0 1.5px var(--accent); }
.gnode:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.flow .gdetail { --g-fill: var(--sunk); margin: 0; padding: 12px 14px 14px; border-top: 1px solid var(--g-rule); background: var(--sunk); color: var(--ink); display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.flow .gdetail > b { font-size: 15px; }
.flow .gdetail .gi { margin-right: 2px; vertical-align: -1px; color: var(--g-ink-2); }
.flow .gdetail .gi-blocking { color: var(--g-acc); }
.flow .gdetail ul { list-style: none; margin: 0; padding: 0; }
.flow .gdetail li + li { border-top: 1px solid var(--g-rule); }
.flow .gdetail li button { width: 100%; border: 0; background: transparent; color: var(--ink); text-align: left; padding: 7px 0; }
.flow .gdetail small { color: var(--g-ink-2); }
/* Full screen covers the top bar (6) but stays under the toast (10), notes (15), sheets (20, 21) and
   the login page (30): a sheet opened from it (Owner) shows, and a tap lands where it is seen. */
.flow.full { position: fixed; inset: 0; z-index: 9; border-radius: 0; display: flex; flex-direction: column; box-shadow: none; }
.flow.full .flow-bar { padding-top: max(12px, env(safe-area-inset-top)); }
.flow.full .flow-scroll { flex: 1; height: auto; }
.flow.full .gdetail { max-height: 42vh; overflow: auto; padding-bottom: max(14px, env(safe-area-inset-bottom)); }
/* Under the full-screen bar: a failed save and the away question (the page's own place is covered). */
.flow.full > .save-err { padding: 10px 14px; border-bottom: 1px solid var(--g-rule); }

.flow-tag.ms-late { color: var(--bad); } .flow-tag.ms-soon { color: var(--away); } .flow-tag.ms-done { color: var(--good); } .flow-tag.ms-ahead { color: var(--ink-2); }
.flow-tag[class*="ms-"] { font-variant-numeric: tabular-nums; }
/* On the Milestones list every milestone waits for its to-dos: that tag is grey; red stays for late. */
.flow-tag.blocked.muted { color: var(--ink-2); }
/* Handing a to-do over: who to ask (the suggestion first, reasons written out), requests and answers */
.hand-task { display: flex; flex-direction: column; gap: 4px; }
.hand-task b { font: 800 19px/1.2 var(--display); overflow-wrap: anywhere; } .hand-task small { color: var(--ink-2); font-size: 13px; }
.cand { width: 100%; display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: center; text-align: left; border: 0; border-radius: var(--r-sm); padding: 12px 14px; background: var(--sunk); color: var(--ink); box-shadow: inset 0 0 0 1px var(--hair); }
.cand.best { box-shadow: inset 0 0 0 2px var(--accent); }
.cand .who { width: 40px; height: 40px; font: 900 17px/1 var(--display); }
.cand b { font-weight: 700; } .cand small { display: block; color: var(--ink-2); font-size: 13px; }

.fy:empty { display: none; }

.fy-item > button.open { border: 0; background: transparent; padding: 0; text-align: left; color: inherit; font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
.fy-item small { color: var(--ink-2); font-size: 13px; }
.flow-tag.ask-in { color: var(--accent); } .flow-tag.ask-out { color: var(--ink-2); } .flow-tag.ask-no { color: var(--bad); }
button.flow-tag { border: 0; background: transparent; padding: 2px 0; text-align: left; text-decoration: underline dotted; text-underline-offset: 3px; }
.tag-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.mini { border: 0; border-radius: 999px; min-height: 32px; padding: 6px 12px; font: 700 13px/1.2 var(--body); background: var(--accent-fill); color: var(--on-accent); }
.mini.ghost { background: color-mix(in srgb, var(--ink) 9%, transparent); color: var(--ink); }

.btn:active, .icon-btn:active, .chip:active, .who:active, .x:active, .gfilter:active, .tool:active, .avatar:active { transform: scale(.9); transition-duration: .08s; }
.cell-tile:active, .g-cell:active { transform: scale(.95); transition-duration: .08s; }
.row-wrap.enter { animation: enter .55s var(--spring) both; animation-delay: var(--d, 0ms); }

<body>
<div class="wrap" id="page">
  <header class="top">
    <h1 class="mark">CUBIC</h1>
    <div class="top-tools">
      <button type="button" class="tool icon" id="bellBtn" aria-haspopup="dialog" aria-label="For you"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.6 2.2H4.4z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg><b class="badge" id="bellBadge" hidden></b></button>
      <button type="button" class="tool icon" id="chatBtn" aria-haspopup="dialog" aria-label="Chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H10l-4.5 3.6V16H4z"/></svg><b class="badge" id="chatBadge" hidden></b></button>
      <button type="button" class="avatar" id="meBtn" aria-haspopup="dialog" aria-label="Menu" data-who=""><span id="meInitial">☰</span><i id="meDot" aria-hidden="true"></i></button>
    </div>
    <div class="sync" id="sync" role="status" aria-live="polite"></div>
  </header>
  <div class="note" id="notice" hidden></div>
  <section class="note away-box" id="awayBox" hidden></section>

  <main id="home">
    <section class="stage" id="cubeView" aria-label="Cube" data-t-al="cube">
      <div class="scene" id="scene" tabindex="0" role="group" aria-label="Cube. Drag it or use the arrow keys to turn it. Tap a space to open it." data-t-al="sceneAria"><div class="cube" id="cube"></div></div>
    </section>
  </main>

  <main id="area" hidden>
    <div class="wrap" style="padding:0;gap:16px">
      <div class="crumb">
        <button type="button" class="btn ghost" id="back" data-t="back">← Back</button>
        <span class="chip" id="areaChip"></span>
      </div>
      <p class="area-num" id="areaNum" aria-hidden="true"></p>
      <div id="areaTitleBox"></div>
      <p class="space-time" id="spaceTime" hidden></p>
      <form id="capture" autocomplete="off">
        <div class="add-row">
          <input class="field" id="newText" type="text" placeholder="New to-do" aria-label="New to-do" data-t-ph="newTodo" data-t-al="newTodo" maxlength="200">
          <button class="btn" type="submit" id="addBtn" data-t="add">Add</button>
        </div>
        <p class="err" id="captureErr" hidden></p>
        <div class="leftover" id="leftover" hidden></div>
      </form>
      <ul class="items" id="items"></ul>
      <div id="planView" hidden></div>
      <p class="empty" id="itemsEmpty" hidden>No to-dos yet.</p>
      <p class="fine" id="swipeHint" data-t="swipeHint">Swipe a row sideways to delete it.</p>
    </div>
  </main>
</div>

<div class="sheet-back" id="sheetBack" hidden></div>
<section class="sheet" id="menuSheet" hidden role="dialog" aria-modal="true" aria-labelledby="menuTitle">
  <div class="sheet-head"><h2 class="sheet-title" id="menuTitle" data-t="menu">Menu</h2><button type="button" class="x-btn" data-close aria-label="Close" data-t-al="close">✕</button></div>
  <div class="sheet-body">
    <section class="card" id="meBar" aria-label="You and your time" data-t-al="meAria">
      <div class="me-row"><span class="who" id="meAvatar" aria-hidden="true"></span><div><b id="meWho"></b><small id="meRole"></small></div></div>
      <p class="fine me-ro" id="meRo" hidden></p>
      <div class="me clock">
        <span class="dot" id="meClockDot" aria-hidden="true"></span>
        <span class="clock-time" id="meTime">0 min</span>
        <button type="button" class="btn ghost" id="clockBtn">Pause</button>
        <button type="button" class="btn ghost" id="switchBtn" data-t="switchPerson">Switch person</button>
      </div>
      <div class="acct" id="acctBox" hidden>
        <p class="fine" id="acctLine"></p>
        <div class="btns">
          <button type="button" class="btn ghost" id="pwBtn" data-t="changePw">Change password</button>
          <button type="button" class="btn ghost" id="signOutBtn" data-t="signOut">Sign out</button>
        </div>
        <form class="pw-form" id="pwForm" method="post" novalidate hidden>

          <label for="pwCur" data-t="pwCurrent">Current password</label>
          <input class="field" id="pwCur" type="password" autocomplete="current-password" maxlength="200">

          <input class="field" id="pwNew" type="password" autocomplete="new-password" maxlength="200">

      </div>

    <input class="field" id="search" type="search" placeholder="Search" aria-label="Search" data-t-ph="search" data-t-al="search">

      <h3 class="label" data-n="—" id="resultsTitle"></h3>
      <ul class="recent" id="resultsList"></ul>
    </section>
    <section class="card" aria-label="Team" data-t-al="team">
      <h3 class="label" data-n="01" data-t="team">Team</h3>
      <ul class="team" id="team"></ul>
    </section>
    <details class="card" id="spacesBox">

      <section class="grid" id="gridView" aria-label="List" data-t-al="list"></section>
    </details>

          <p class="fine" id="backupHint" data-t="backupHint"></p>

            <button type="button" class="btn ghost" id="exportCopy" data-t="copy">Copy</button>

          <p class="fine" id="exportMsg" hidden></p>
          <textarea class="field" id="exportText" readonly hidden aria-label="Exported data" data-t-al="exportTextAria"></textarea>

          <h4 data-t="import">Import</h4>

          <div class="btns">
            <label class="btn ghost file-btn"><span data-t="chooseFile">Choose a file</span><input type="file" id="importFile" accept=".json,.csv,application/json,text/csv,text/plain"></label>
          </div>
          <textarea class="field" id="importText" placeholder="Paste here" aria-label="Data to import" data-t-ph="pasteHere" data-t-al="importAria"></textarea>
          <div class="btns"><button type="button" class="btn ghost" id="importCheck" data-t="check">Check</button></div>
          <p class="err" id="importErr" hidden></p>
          <div id="importPlan" hidden></div>
        </section>
      </div>
    </details>
    <section class="card settings">
      <h3 class="label" data-n="04" data-t="settings">Settings</h3>
      <div class="btns"><button type="button" class="btn ghost" id="themeBtn">☾</button></div>
    </section>
  </div>
</section>
<section class="sheet" id="updatesSheet" hidden role="dialog" aria-modal="true" aria-labelledby="updTitle">
  <div class="sheet-head"><h2 class="sheet-title" id="updTitle" data-t="forYou">For you</h2><button type="button" class="x-btn" data-close aria-label="Close" data-t-al="close">✕</button></div>

/* Puts freshly drawn rows (`kids`, elements) in `box`. A row already there with the same shape (the
   same elements and attributes) stays, and only its changed words are copied in: a redraw that only
   moves a time on ("2 min ago", the 15 s tick) moves nothing under keyboard focus or a screen reader.
   A row that differs is replaced (callers keep focus with keepFocus). Only for rows whose buttons act
   on what their attributes say, or look the to-do up when tapped, so a kept row never acts on old data. */
function putKids(box, kids) {
  const same = (a, b) => a.nodeType === b.nodeType && (a.nodeType !== 1 || (a.tagName === b.tagName
    && a.attributes.length === b.attributes.length && [...a.attributes].every(x => b.getAttribute(x.name) === x.value)

  const words = (a, b) => { if (a.nodeType === 3) { if (a.data !== b.data) a.data = b.data; } else a.childNodes.forEach((c, k) => words(c, b.childNodes[k])); };
  const old = [...box.childNodes];
  if (old.length !== kids.length) { box.replaceChildren(...kids); return; }
  kids.forEach((k, n) => { if (same(old[n], k)) words(old[n], k); else old[n].replaceWith(k); });
}

/* Every write goes through dbWrite(): writes to one document wait in line (the db asks for one at
   a time), and a passing `unavailable` is retried once after a short pause. */
const writeLines = new Map();
function dbWrite(path, op, data) {
  const run = () => (op === 'delete' ? S.db.doc(path).delete() : S.db.doc(path)[op](data));
  const once = async () => {
    try {
      try { return await run(); }
      catch (e) { if (e && e.code === 'unavailable') { await new Promise(res => setTimeout(res, 300 + Math.floor(Math.random() * 500))); return await run(); } throw e; }
    } catch (e) { throw { code: e && e.code, message: e && e.message, op, path }; }
  };
  const next = (writeLines.get(path) || Promise.resolve()).catch(() => {}).then(once);
  writeLines.set(path, next);
  next.catch(() => {}).then(() => { if (writeLines.get(path) === next) writeLines.delete(path); });
  return next;
}

/* ── Chat: one shared conversation for the three. A message stores the writer's id, never a name. ── */

/* ── World clock: each person's city and local time (team/<id>: { city, tz }). ── */
const ZONES = [['Ulaanbaatar', 'Asia/Ulaanbaatar'], ['Shanghai', 'Asia/Shanghai'], ['Seoul', 'Asia/Seoul'], ['Tokyo', 'Asia/Tokyo'], ['Singapore', 'Asia/Singapore'],
  ['Sydney', 'Australia/Sydney'], ['London', 'Europe/London'], ['Berlin', 'Europe/Berlin'], ['New York', 'America/New_York'], ['Toronto', 'America/Toronto'],
  ['Chicago', 'America/Chicago'], ['Denver', 'America/Denver'], ['Seattle', 'America/Los_Angeles'], ['San Francisco', 'America/Los_Angeles'], ['Los Angeles', 'America/Los_Angeles'], ['Honolulu', 'Pacific/Honolulu']];
const zoneOk = tz => { try { new Intl.DateTimeFormat('en', { timeZone: tz }); return true; } catch (e) { return false; } };

  const day = there > here ? ` ${tr('dayPlus')}` : there < here ? ` ${tr('dayMinus')}` : '';
  return `${String(h).padStart(2, '0')}:${parts.minute}${!bare && nightHour(h) ? ` ☾ ${tr('night')}` : ''}${day}`;
}
/* Times, and the cities next to them on the login's cards: the team's cities may arrive after the

function tickClocks() {
  document.querySelectorAll('[data-clock]').forEach(n => { const t = localTime(n.dataset.clock); n.textContent = n.closest('.team') ? (t ? ` · ${t}` : '') : t; });
  document.querySelectorAll('[data-zone]').forEach(n => { n.textContent = cityLine(n.dataset.zone); });

    el('span', { class: 'who', 'data-who': m.id, 'aria-hidden': 'true', text: m.name[0] }), el('span', { text: `${m.name} · ${cityLine(m.id)}` }), el('b', { 'data-clock': m.id, text: localTime(m.id) })])));

  const sel = el('select', { class: 'field', 'aria-label': tr('cityOf', m.name), 'data-editing': '1', 'data-fkey': `city:${m.id}` }, [el('option', { value: '', text: tr('noCity') }),
    ...ZONES.map(([city, tz], k) => el('option', { value: String(k), text: city }))]);
  const cur = S.team.get(m.id); if (cur) { const k = ZONES.findIndex(([c, tz]) => c === cur.city && tz === cur.tz); if (k >= 0) sel.value = String(k); }
  btn.replaceWith(sel); sel.focus();

/* ── Handing a to-do to a teammate ──
   The owner of a to-do (anyone, for a to-do with no owner) asks one of the other two to take it;
   the one asked accepts or declines. Someone who wants a teammate's to-do offers to take it; the
   owner accepts or declines. Until an answer the owner stays the same. On the to-do:
     ask       the open request: { to: who answers, give: who would own it, from: the owner when
               asked, by: the asker's account id, at, note }
     nope      who declined since the owner last changed (the next suggestion skips them)
     declined  the last "no", so the asker sees it and gets the next step
   Deciding fast: the page suggests whom to ask and says why (whose side it is, the kind of work,

const ASK_STALE_MS = 12 * 3600000;
const myWho = () => whoOf(S.me);
function askOf(i) {

  return { to: a.to, give: a.give, from: member(a.from) ? a.from : '', by: typeof a.by === 'string' ? a.by : '', at: a.at, note: typeof a.note === 'string' ? a.note.trim().slice(0, 200) : '' };

}
const offerOf = a => !!a && a.to !== a.give;
const ageOf = t => { const m = Math.max(0, Math.floor((Date.now() - t) / 60000)); return m < 60 ? tr('min', m) : fmt(Date.now() - t); };
/* My part in a to-do's request: I answer it, I asked (or it is my to-do), or none. Two accounts of
   one person count as one (isMine). A "no" is for the one who asked, never for the one who said it. */
const answersMe = i => { const a = askOf(i); return !!a && a.to === myWho(); };
const waitsOnOthers = i => { const a = askOf(i), mine = myWho(); return !!a && !!mine && a.to !== mine && (isMine(a.by) || i.who === mine); };
const declinedForMe = i => { const d = declinedOf(i), mine = myWho(); return !!d && !!mine && d.by !== mine && (isMine(d.askBy) || (i.who || '') === mine); };
/* One request at a time: while one is open, only the one who made it may replace it. */
const mayAsk = i => { const a = askOf(i); return !a || isMine(a.by); };
/* Who waits for a request's answer: the one who offered, or the one who asked. */
const askerOf = a => member(offerOf(a) ? a.give : whoOf(a.by) || a.from);

/* Each of these checks the to-do as it is now, so a tap on something drawn before a teammate's
   change writes nothing it did not show. */
function askHand(id, give, note) {
  const i = S.items.get(id), mine = myWho(); if (!i || !mine || !member(give) || !canWriteNow()) return Promise.resolve(false);
  const owner = i.who || '';
  if (!mayAsk(i) || (owner && owner !== mine && give !== mine)) return Promise.resolve(false);   /* a teammate's to-do: offer only yourself */
  const to = owner && owner !== mine ? owner : give;   /* an offer goes to the owner; a hand-off to the one asked */
  return patchItem(id, { ask: { to, give, from: owner, by: S.me, at: Date.now(), note: (note || '').trim().slice(0, 200) }, declined: null }, 'ask');
}
/* `at`: the request the person saw. A newer one is not answered by a tap on the old one. */
function answerHand(id, yes, at) {
  const i = S.items.get(id), a = askOf(i), mine = myWho();
  if (!a || a.to !== mine || (at && a.at !== at) || !canWriteNow()) return Promise.resolve(false);
  if (yes) return patchItem(id, { who: a.give, ask: null, nope: [], declined: null }, 'accept');
  const nope = offerOf(a) ? nopeOf(i) : [...new Set([...nopeOf(i), mine])];

}
const takeBack = id => (waitsOnOthers(S.items.get(id)) ? patchItem(id, { ask: null }, 'cancel') : Promise.resolve(false));
/* The owner keeps it and starts afresh; anyone else only puts the "no" away (who declined stays). */
const keepIt = id => { const i = S.items.get(id); return !declinedForMe(i) ? Promise.resolve(false) : patchItem(id, i.who === myWho() ? { nope: [], declined: null } : { declined: null }, 'keep'); };
const takeIt = id => { const i = S.items.get(id); return i && !i.who && myWho() && mayAsk(i) ? patchItem(id, { who: myWho(), ask: null, nope: [], declined: null }, 'owner') : Promise.resolve(false); };
const dropOwner = id => { const i = S.items.get(id); return i && i.who && i.who === myWho() && mayAsk(i) ? patchItem(id, { who: '', ask: null, nope: [], declined: null }, 'owner') : Promise.resolve(false); };
/* Ticking a to-do (or reopening it) ends its open request and puts its "no" away: a request is for
   an open to-do, and an old one must not come back, with its old time, when the to-do is reopened. */
const tickOf = (id, done) => { const i = S.items.get(id); return i && (i.ask || i.declined) ? { done, ask: null, declined: null } : { done }; };

/* Who to ask: the side's own person first, then the kind of work (technology: Vida and Anand;
   business, marketing, branding: Obama), then someone awake now, then fewer open to-dos. Whoever
   declined goes last. */
const DOMAIN = { vida: 'tech', anand: 'tech', obama: 'biz' };
const SIDE_DOMAIN = ['tech', '', 'tech', 'biz', 'biz', 'biz'];
function hourAt(id) {
  const z = S.team.get(id); if (!z) return null;
  try { return +new Intl.DateTimeFormat('en-US', { timeZone: z.tz, hour: 'numeric', hourCycle: 'h23' }).format(new Date()) % 24; } catch (e) { return null; }
}
/* Awake there from 08:00 to 22:00; night as the world clock says it (nightHour). In the early morning
   between, the page says neither: null, as when the city is not known. */
const awakeAt = id => { const h = hourAt(id); return h === null ? null : nightHour(h) ? false : h >= 8 ? true : null; };
function loadOf(id) {
  let n = 0;
  S.items.forEach(i => { if (i.done || isViewCell(i.cell) || i.cell === MILESTONE_CELL) return; if (i.who === id) n += 1; else { const a = askOf(i); if (a && a.give === id) n += 1; } });
  return n;
}
function rankFor(i) {
  const owner = i.who || '', mine = myWho(), side = CELL_RE.test(i.cell || '') ? +i.cell[1] : -1, nope = nopeOf(i);
  return TEAM.filter(m => m.id !== owner && m.id !== mine).map(m => {
    const fit = SIDE_OWNER[side] === m.id ? 2 : SIDE_DOMAIN[side] && SIDE_DOMAIN[side] === DOMAIN[m.id] ? 1 : 0;
    const load = loadOf(m.id), awake = awakeAt(m.id), no = nope.includes(m.id);
    return { m, fit, load, awake, no, score: (no ? -1000 : 0) + fit * 8 + (awake === true ? 4 : awake === false ? -4 : 0) - load * 0.5 };
  }).sort((a, b) => b.score - a.score);
}
const whyText = c => [c.fit === 2 ? tr('whySide') : c.fit === 1 ? tr('whyRole') : null, tr('openN', c.load),
  c.awake === null ? null : c.awake ? tr('awakeAt', localTime(c.m.id, true)) : tr('nightAt', localTime(c.m.id, true)), c.no ? tr('saidNo') : null].filter(Boolean).join(' · ');

/* What I should do next: my to-dos that can start now, the nearest milestone first (late first),
   then the one that unblocks the most open to-dos, then the build order. */
function doNext(limit) {
  const mine = myWho(); if (!mine || !S.loaded) return [];
  const fl = flow(), P = plan(), md = milestoneData(P, null, fl), rank = new Map(P.order.map((id, k) => [id, k]));
  const soonest = new Map();
  md.stones.forEach(st => { if (st.i.done || st.days === null) return; st.need.forEach(n => { const cur = soonest.get(n.id); if (!cur || cur.days > st.days) soonest.set(n.id, st); }); });
  return [...S.items.values()].filter(i => i.who === mine && !i.done && i.cell !== MILESTONE_CELL && !isViewCell(i.cell) && fl.get(i.id).state !== 'blocked')
    .map(i => ({ i, st: soonest.get(i.id) || null, opens: [...downstream(i.id)].filter(d => !S.items.get(d).done).length }))
    .sort((a, b) => (a.st ? a.st.days : 1e6) - (b.st ? b.st.days : 1e6) || b.opens - a.opens || (rank.get(a.i.id) ?? 1e9) - (rank.get(b.i.id) ?? 1e9))
    .slice(0, limit);
}

/* The line under a to-do that has a request or a "no" on it, in words for the one looking: the one
   asked answers it; "your offer" only for the one who made it, anyone else reads who offered. */
function handTag(i) {

    const line = el('span', { class: 'flow-tag ask-in', text: offerOf(a) ? tr('offerYou', n) : tr('askedYou', n) });
    if (!S.canWrite) return line;   /* read-only: the request in words, no buttons that would do nothing */
    /* data-at names the request they answer: a newer one is a new button, never an old one kept (putKids). */
    return el('div', { class: 'tag-row' }, [line,
      el('button', { type: 'button', class: 'mini', 'data-fkey': `ya:${i.id}`, 'data-at': String(a.at), 'aria-label': tr('acceptX', txt(i)), text: tr('accept'), onclick: () => answer(i.id, true, a.at) }),

/* The to-do as the store has it now. On Vercel this asks the server for the row (and brings this

/* From a row or For you. Accepting an offer gives the to-do to the one who offered, and says so. A

const answering = new Set();

/* "Decide in chat": the question goes after what is already written there (an unsent message stays), once. */
function toChat(i) {

    if (!url && S.canWrite) { if (S.peopleReady && S.me && !whoOf(S.me)) showLogin(false); reconcileClock(true); seenStart(); }
  }, failed);
  db.collection('faces').onSnapshot(snap => {
    snap.docs.forEach(d => {
      const m = /^f([0-5])$/.exec(d.id), v = d.data(); if (!m || !v) return;
      const f = S.faces[+m[1]];
      if (typeof v.title === 'string' && v.title) f.title = v.title;
      if (Array.isArray(v.cells)) v.cells.slice(0, 4).forEach((t, c) => { if (typeof t === 'string' && t) f.cells[c] = t; });
      f.editedAt = +v.editedAt || 0; f.stored = true;
    });
    if (!snap.metadata.fromCache) { S.facesReady = true; arrived(); }
    queueRender();
  }, failed);
  db.collection('items').onSnapshot(snap => {
    const before = S.items;
    S.items = new Map(snap.docs.map(d => [d.id, { id: d.id, ...d.data() }]).filter(([, v]) => typeof v.text === 'string'));
    const first = !S.itemsReady;
    if (!snap.metadata.fromCache) { S.itemsReady = true; arrived(); }
    if (!first) noticeChanges(before);
    queueRender();
  }, failed);
  /* People and clocks are read by everyone (the team card needs them); only choosing a name and
     the timer need to know who this viewer is. */
  db.collection('people').onSnapshot(snap => {
    const mine = S.me && S.people.get(S.me);
    S.people = new Map(snap.docs.map(d => [d.id, d.data()]).filter(([, v]) => v && member(v.who)));
    if (mine && snap.metadata.hasPendingWrites) S.people.set(S.me, mine);
    if (!snap.metadata.fromCache && !S.peopleReady) { S.peopleReady = true; initData(); if (S.me && !whoOf(S.me)) showLogin(false); }
    renderClock(); queueRender();
  }, failed);
  db.collection('clock').onSnapshot(snap => {
    const mine = S.me && S.clocks.get(S.me);
    S.clocks = new Map(snap.docs.map(d => [d.id, cleanClock(d.data())]).filter(([, v]) => v));
    if (mine && snap.metadata.hasPendingWrites) S.clocks.set(S.me, mine);
    if (!snap.metadata.fromCache && !S.clockReady) { S.clockReady = true; initData(); reconcileClock(true); }
    /* Same account on two devices: the one being used takes the clock back from one that went hidden. */
    else if (S.clockReady && !document.hidden && $('awayBox').hidden && myClock() && leftOf(myClock()) && Date.now() - S.lastInput < AWAY_ASK_MS) reconcileClock(false);
    /* Another device answered the away question, or took the clock back: the question goes. */
    if (!$('awayBox').hidden && !(myClock() && leftOf(myClock()))) $('awayBox').hidden = true;
    renderClock(); if (S.sheet === 'menuSheet' && !isEditing()) renderTeam(); if (S.cell) renderSpaceTime();
  }, failed);
  /* The chat (its newest messages), the team's cities, and when each person last looked. These are
     extras: one that cannot be read turns off only itself, says so where it shows, and leaves the
     page's own notice (and its "cannot reach" timer) to the to-dos and what they need. */
  const chatCol = db.collection('chat');
  (typeof chatCol.orderBy === 'function' ? chatCol.orderBy('at', 'desc').limit(300) : chatCol).onSnapshot(snap => {
    const prev = S.chat, wasReady = S.chatReady;
    S.chat = snap.docs.map(d => cleanMsg(d.id, d.data())).filter(Boolean).sort((a, b) => a.at - b.at);
    if (!snap.metadata.fromCache && !S.chatReady) { S.chatReady = true; seenStart(); }
    const known = new Set(prev.map(m => m.id)), news = wasReady ? S.chat.filter(m => !known.has(m.id) && !isMine(m.by)) : [];
    if (news.length && S.sheet !== 'chatSheet') { const m = news[news.length - 1]; ping(member(whoOf(m.by)), tr('chatSays', nameOfUid(m.by), short(m.text, 90)), 'chatSheet'); }
    if (S.sheet === 'chatSheet') {
      renderChat(); markSeen('chat', lastChatAt());
      /* A screen reader hears only a message that just came in, never the whole conversation again. */
      if (news.length) $('chatLive').replaceChildren(el('span', { text: news.slice(-3).map(m => tr('chatSays', nameOfUid(m.by), m.text)).join(' ') }));
    }
    renderBadges();
  }, () => { S.chatFailed = true; if (S.sheet === 'chatSheet') renderChat(); renderBadges(); seenStart(); });
  db.collection('team').onSnapshot(snap => {
    S.team = new Map(snap.docs.map(d => [d.id, d.data()]).filter(([k, v]) => member(k) && v && typeof v.city === 'string' && typeof v.tz === 'string' && zoneOk(v.tz)).map(([k, v]) => [k, { city: v.city.slice(0, 60), tz: v.tz }]));
    renderClock(); if (S.sheet === 'menuSheet' && !isEditing()) renderTeam(); if (S.sheet === 'chatSheet') renderWorldClocks();
    if (loginOpen()) tickClocks();
  }, () => { S.teamFailed = true; if (S.sheet === 'menuSheet' && !isEditing()) renderTeam(); });
  db.collection('seen').onSnapshot(snap => {
    const mine = S.me && snap.docs.find(d => d.id === S.me);
    const v = mine ? mine.data() : null;
    /* Never move a mark back (this page may already have written a newer one), and never take one
       that cannot be trusted (markOk): seenAt() then counts from where this visit began. What was
       seen ahead is kept from both. */
    if (v && typeof v === 'object') {
      const mark = k => Math.max(...[+v[k], S.seen ? +S.seen[k] : NaN].map(x => (markOk(x) ? x : 0))) || null;
      const keys = k => { const a = v.ahead && Array.isArray(v.ahead[k]) ? v.ahead[k].filter(x => typeof x === 'string') : []; return [...new Set([...aheadOf(k), ...a])].slice(0, 300); };
      S.seen = { updates: mark('updates'), chat: mark('chat'), ahead: { updates: keys('updates'), chat: keys('chat') } };
    }
    if (!snap.metadata.fromCache) { S.seenReady = true; seenStart(); }
    renderBadges();
  }, () => { S.seenFailed = true; });   /* no counts then (nor marks written over one not read); the notes still show */
  if (S.remote) S.remote.start();
}

/* ── Start ── */
(function start() {
  /* The font stylesheet loads as "print" so a stalled request never holds the page; switch it on now. */
  try { $('fonts').media = 'all'; } catch (e) { /* fonts are optional */ }
  const theme = store.get('cubic-theme'); if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
  applyStatic();
  $('themeBtn').addEventListener('click', () => setTheme(isDark() ? 'light' : 'dark'));
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', showThemeBtn); } catch (e) { /* older browsers */ }
  /* A reload with a sheet's step on top (no sheet is open now): step back over it. */
  if (atSheetStep()) { stepOff = true; history.back(); }
  readHash(); initCubeInput(); initCapture(); initClock(); initChat(); initAccount(); route(); renderClock(); renderBadges();
  $('meBtn').addEventListener('click', () => openSheet('menuSheet'));
  $('bellBtn').addEventListener('click', () => openSheet('updatesSheet'));
  $('chatBtn').addEventListener('click', () => openSheet('chatSheet'));
  $('sheetBack').addEventListener('click', () => closeSheets());
  document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => closeSheets()));
  $('search').addEventListener('input', renderSearch);
  $('back').addEventListener('click', () => {
    if (history.state && history.state.cubic === 'space') { history.back(); return; }
    S.cell = null; setHash(); route();
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape' || e.defaultPrevented || S.authOpen || (e.target.closest && e.target.closest('[data-editing]'))) return;
    /* The login is on top of everything: Escape is its Cancel when it has one, and never reaches a sheet under it. */
    if (loginOpen()) { const c = $('login').querySelector('[data-cancel]'); if (c) { e.preventDefault(); c.click(); } return; }
    if (S.sheet) { e.preventDefault(); closeSheets(); }
    else if (G.full) { e.preventDefault(); setFull(false, S.cell === GRAPH_CELL ? renderGraph : renderTimeline); }
  });
  window.addEventListener('hashchange', () => { closeSheets(true); readHash(); route(); });
  document.addEventListener('focusout', () => setTimeout(() => { if (S.renderQueued) queueRender(); }, 50));
  connect();
})();
</script>
</body>
</html>
